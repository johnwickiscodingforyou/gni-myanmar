name: Myanmar Management Pipeline

on:
  schedule:
    - cron: '*/30 * * * *'
  repository_dispatch:
    types: [mad-pipeline-complete]
  workflow_dispatch:

jobs:
  management:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run Management Pipeline
        env:
          GNI_API_KEY:            ${{ secrets.GNI_API_KEY }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY:       ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          
          GH_MODELS_KEY:          ${{ secrets.GH_MODELS_KEY }}
          CF_API_TOKEN:           ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID:          ${{ secrets.CF_ACCOUNT_ID }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID:    ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MYANMAR_DISPATCH_PAT:   ${{ secrets.MYANMAR_DISPATCH_PAT }}
        run: python myanmar_management.py
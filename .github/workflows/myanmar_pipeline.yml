name: GNI Myanmar Intelligence Pipeline

# TRIGGER DESIGN
# James instruction: "start when we get alert from GNI-Autonomous
# (i mean not depend to fix time alarm)"
#
# Way 1 - PRIMARY: repository_dispatch from GNI Intelligence Pipeline
#   GNI Autonomous sends mad-pipeline-complete event when done.
#   Myanmar pipeline starts INSTANTLY. Truly event-driven.
#
# Way 2 - SAFETY NET: schedule every 30 minutes
#   If Way 1 dispatch was missed, cron catches it via Supabase signal.
#   Pipeline reads pipeline_signals table in Step 0.
#   If no unprocessed signal found, exits gracefully.
#
# workflow_dispatch - manual trigger for testing and emergency runs.

on:
  repository_dispatch:
    types: [mad-pipeline-complete]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-myanmar-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            supabase \
            python-dotenv \
            requests \
            reportlab
          # NOTE: groq library intentionally NOT installed
          # GNI-R-169: uses direct REST to Groq API
          # groq library blocked by Azure IPs on GitHub Actions
          # Backup providers: Gemini Flash (B1) + Cloudflare Workers AI (B2)

      - name: Run Myanmar Intelligence Pipeline
        run: python myanmar_management.py
        env:
          GNI_API_KEY:           ${{ secrets.GNI_API_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          CF_API_TOKEN:          ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID:         ${{ secrets.CF_ACCOUNT_ID }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID:   ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GITHUB_ACTIONS:        "true"
name: Myanmar Market Pipeline

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Run date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests supabase

      - name: Run Market Pipeline
        env:
          GNI_API_KEY:            ${{ secrets.GNI_API_KEY }}
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          HF_API_KEY:             ${{ secrets.HF_API_KEY }}
          GH_MODELS_KEY:          ${{ secrets.GH_MODELS_KEY }}
          CF_API_TOKEN:           ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID:          ${{ secrets.CF_ACCOUNT_ID }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID:    ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python myanmar_market.py